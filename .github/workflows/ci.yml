name: CI

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/auto-update.yml'
  pull_request:
    paths:
      - 'patches/**'
      - 'ci/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'patches-list.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/auto-update.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-patches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.7.1'

      - name: Repository consistency
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1)"
          [[ "$(jq -r '.version' patches-list.json)" == "$VERSION" ]]
          python -m py_compile ci/select_upstream.py ci/verify_patched_apk.py ci/verify_manifest.py
          python -m json.tool ci/baseline.json >/dev/null
          python -m json.tool ci/runtime-quarantine.json >/dev/null
          python -m json.tool patches-list.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          quarantine = json.loads(Path('ci/runtime-quarantine.json').read_text())['entries']
          codes = [entry['version_code'] for entry in quarantine]
          assert all(isinstance(code, int) and code > 0 for code in codes)
          assert len(codes) == len(set(codes)), 'Duplicate runtime quarantine versionCode'

          verified = json.loads(Path('ci/runtime-verified.json').read_text())['entries']
          assert verified, 'At least one device-tested upstream must be approved'
          release_targets = []
          for entry in verified:
              name, code = entry['version_name'], entry['version_code']
              assert isinstance(name, str) and name
              assert isinstance(code, int) and code > 0
              assert entry.get('verified_at') and entry.get('device')
              assert entry.get('test_summary') and entry.get('evidence')
              release_targets.append((name, code))
              assert not any(
                  q.get('version_code') == code or (
                      q.get('version_code') is None and q.get('version_name') == name
                  )
                  for q in quarantine
              ), 'Approved APK also in quarantine'
          assert len(release_targets) == len(set(release_targets)), 'Duplicate approved upstream'

          workflow = Path('.github/workflows/auto-update.yml').read_text()
          expected = "if: github.repository == '" + os.environ['GITHUB_REPOSITORY'] + "' || github.event_name == 'workflow_dispatch'"
          assert expected in workflow, 'Scheduled autobuild job is disabled by wrong repository guard'
          assert 'clip_mode:' in workflow, 'Missing Clips diagnostic selector'
          assert 'steps.runtime.outputs.quarantined != \'true\'' in workflow, 'Missing quarantine publish gate'
          assert 'ci/runtime-verified.json' in workflow, 'Missing physically verified upstream release gate'
          PY

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Upload MPP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vk-video-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error
